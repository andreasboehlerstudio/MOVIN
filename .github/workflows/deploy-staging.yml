name: Deploy Staging to IONOS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: staging-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and upload staging website
    runs-on: ubuntu-latest
    environment:
      name: Staging
      url: https://staging.movin-freiburg.de

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Create protected SMTP runtime configuration
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_ENCRYPTION: ${{ secrets.SMTP_ENCRYPTION }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          CONTACT_RECEIVER_EMAIL: ${{ secrets.CONTACT_RECEIVER_EMAIL }}
          CAREER_RECEIVER_EMAIL: ${{ secrets.CAREER_RECEIVER_EMAIL }}
          ANAMNESE_RECEIVER_EMAIL: ${{ secrets.ANAMNESE_RECEIVER_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          encode() { printf '%s' "$1" | base64 -w 0; }
          mkdir -p dist/api
          cat > dist/api/.smtp-config.php <<PHP
          <?php
          return [
              'host' => base64_decode('$(encode "${SMTP_HOST:-smtp.ionos.de}")'),
              'port' => (int) base64_decode('$(encode "${SMTP_PORT:-587}")'),
              'encryption' => base64_decode('$(encode "${SMTP_ENCRYPTION:-tls}")'),
              'username' => base64_decode('$(encode "${SMTP_USER:-}")'),
              'password' => base64_decode('$(encode "${SMTP_PASS:-}")'),
              'from_email' => base64_decode('$(encode "${SMTP_FROM_EMAIL:-noreply@movin-freiburg.de}")'),
              'from_name' => base64_decode('$(encode "${SMTP_FROM_NAME:-MOVIN Website}")'),
              'contact_receiver' => base64_decode('$(encode "${CONTACT_RECEIVER_EMAIL:-kontakt@movin-freiburg.de}")'),
              'career_receiver' => base64_decode('$(encode "${CAREER_RECEIVER_EMAIL:-daniel.klein@movin-freiburg.de}")'),
              'anamnese_receiver' => base64_decode('$(encode "${ANAMNESE_RECEIVER_EMAIL:-anamnesebogen@movin-freiburg.de}")'),
          ];
          PHP

      - name: Create protected Analytics runtime configuration
        env:
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          ANALYTICS_DASHBOARD_TOKEN: ${{ secrets.ANALYTICS_DASHBOARD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY ANALYTICS_DASHBOARD_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing Staging Environment secret: $name"
              exit 1
            fi
          done
          encode() { printf '%s' "$1" | base64 -w 0; }
          mkdir -p dist/api
          cat > dist/api/.analytics-config.php <<PHP
          <?php
          return [
              'property_id' => '391939422',
              'client_email' => 'movin-550@movin-501211.iam.gserviceaccount.com',
              'private_key' => base64_decode('$(encode "$GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY")'),
              'dashboard_token' => base64_decode('$(encode "$ANALYTICS_DASHBOARD_TOKEN")'),
          ];
          PHP

      - name: Check staging deployment settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_PORT FTP_TARGET_DIR; do
            if [ -z "${!name}" ]; then
              echo "Missing Staging Environment secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install deployment dependencies
        run: sudo apt-get update && sudo apt-get install --yes lftp php-cli

      - name: Validate PHP form backend
        run: find dist/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Upload build to IONOS staging
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          target_dir="${FTP_TARGET_DIR%/}/"

          if [ "$FTP_PORT" = "22" ]; then
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "sftp://$FTP_SERVER:$FTP_PORT" -e "
              set cmd:fail-exit yes;
              set net:max-retries 2;
              set net:timeout 20;
              set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=accept-new';
              mirror --reverse --verbose --parallel=4 dist/ $target_dir;
              rm -f ${target_dir}videos/home/evidenz-physiotherapie-scroll.mp4;
              rm -f ${target_dir}images/home/evidenz-physiotherapie-poster.webp;
              bye;
            "
          else
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER:$FTP_PORT" -e "
              set cmd:fail-exit yes;
              set net:max-retries 2;
              set net:timeout 20;
              set ftp:ssl-force yes;
              set ftp:ssl-protect-data yes;
              set ssl:verify-certificate yes;
              mirror --reverse --verbose --parallel=4 dist/ $target_dir;
              rm -f ${target_dir}videos/home/evidenz-physiotherapie-scroll.mp4;
              rm -f ${target_dir}images/home/evidenz-physiotherapie-poster.webp;
              bye;
            "
          fi
